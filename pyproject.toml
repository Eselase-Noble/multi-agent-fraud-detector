[project]
name = "intellifraud-copilot"
version = "1.0.0"
description = "Multi-Agent RAG System for Financial Fraud Analysis"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "openai>=1.3.0",
    "deepseek>=0.1.0",
    "langchain>=0.0.340",
    "langchain-openai>=0.0.2",
    "faiss-cpu>=1.7.4",
    "chromadb>=0.4.22",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.23",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "rank-bm25>=0.2.2",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.9.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]

[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"